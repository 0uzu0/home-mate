[workspace]

[package]
name = "rig-bigmodel-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rig-core = { version = "=0.46.0", default-features = false, features = ["derive", "reqwest", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "live"
path = "src/live.rs"

[[bin]]
name = "replay"
path = "src/replay.rs"
