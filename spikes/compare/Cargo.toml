[workspace]

[package]
name = "kernel-compare"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hm-core = { path = "../../crates/hm-core" }
genai-swap-spike = { path = "../genai-swap" }
rig-core = { version = "=0.46.0", default-features = false, features = ["derive", "reqwest", "rustls"] }
genai = "=0.7.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "compare"
path = "src/main.rs"
