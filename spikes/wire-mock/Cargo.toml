[workspace]

[package]
name = "wire-mock"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-stream = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "wire-mock"
path = "src/main.rs"

[[bin]]
name = "capture"
path = "src/capture.rs"
