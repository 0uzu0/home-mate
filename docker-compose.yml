services:
  hm-core:
    # Pull the official prebuilt multi-arch image (linux/amd64 + linux/arm64)
    # with in-process Silero VAD v4 and the Vue 3 Web Console pre-bundled.
    # To build from local source instead, run:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/yes999zc/home-mate:latest
    container_name: home-mate-core
    restart: unless-stopped
    # Host networking is required on Linux NAS deployments so LAN UDP broadcast
    # discovery (:8933/udp) and real peer client IPs (for private-LAN checks)
    # reach hm-core directly without bridge NAT rewriting.
    # On macOS Docker Desktop (where host networking is isolated to the Linux VM),
    # comment out `network_mode: host` and uncomment the `ports:` block below.
    network_mode: host
    # ports:
    #   - "8930:8930" # Web Console & HTTP Management API
    #   - "8932:8932" # Northbound Protocol v2 TCP Listener for Android / Linux Gateways
    #   - "8933:8933/udp" # LAN UDP Beacon Discovery for Android Gateways
    environment:
      TZ: Asia/Shanghai
      HM_NODE_ID: nas-core-1
      HM_DATA_DIR: /data
      HM_WEB_DIR: /app/web/dist
      HM_BIND: 0.0.0.0:8930
      HM_GATEWAY_BIND: 0.0.0.0:8932
      HM_GATEWAY_ALLOW_LAN: "1"
      RUST_LOG: hm_core=info
    volumes:
      # Before first start on Linux NAS, create and grant container UID 1000:1001 access:
      #   mkdir -p ./data && sudo chown -R 1000:1001 ./data
      # Silero VAD v4 is pre-bundled inside the image at /app/models/silero_vad.onnx
      # (place a custom model at ./data/models/silero_vad.onnx to override it).
      - ./data:/data
