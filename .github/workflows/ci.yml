name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '!docs/fixtures/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '!docs/fixtures/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust & Web Console CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Gate checks
        run: |
          python3 tools/line_gate.py --self-test
          python3 tools/line_gate.py
          python3 tools/size_gate.py --self-test
      - name: Rust format, slim check, clippy & tests
        run: |
          cargo fmt --all -- --check
          cargo check -p hm-core --no-default-features --locked --all-targets
          cargo clippy --workspace --locked --all-targets -- -W clippy::all
          cargo test --workspace --locked
      - name: Web console build & regression suites
        run: |
          cd web
          npm ci
          npm run build
          for t in tests/*.mjs; do node "$t"; done
